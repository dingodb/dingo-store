name: CMake_ubuntu

on:
  push:
    branches: [ "main", "quickBI-v4.0.0" ]
  pull_request:
    branches: [ "main", "quickBI-v4.0.0" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  DINGO_EUREKA_INSTALL_PATH: /root/.local/dingo-eureka

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest
    # This image includes Eureka; the old Ubuntu dev image only contains build tools.
    container: dingodatabase/dingo-eureka:ubuntu2204-store-4f66a7c@sha256:55bacb3c1413465ae73e87611ab39a3470b358a0082b7a456df58264f0e436a8

    steps:
    - uses: actions/checkout@v4

    - name: Set Safe Dir
      run: git config --global --add safe.directory $PWD

    - name: Install Rust
      run: |
        wget https://static.rust-lang.org/dist/rust-1.78.0-x86_64-unknown-linux-gnu.tar.gz
        echo "1307747915e8bd925f4d5396ab2ae3d8d9c7fad564afbc358c081683d0f22e87  rust-1.78.0-x86_64-unknown-linux-gnu.tar.gz" | sha256sum --check
        tar -xzf rust-1.78.0-x86_64-unknown-linux-gnu.tar.gz
        sh rust-1.78.0-x86_64-unknown-linux-gnu/install.sh --prefix=/opt/rust
        rm -rf rust-1.78.0-x86_64-unknown-linux-gnu rust-1.78.0-x86_64-unknown-linux-gnu.tar.gz
        echo "/opt/rust/bin" >> "$GITHUB_PATH"

    - name: Set Limit
      run: |
          prlimit --pid $$ --nofile=1048576:1048576|| echo "Failed to set nofile limit (non-fatal)"
          sysctl fs.inotify.max_user_instances=1280 || true
          sysctl fs.inotify.max_user_watches=655360 || true
    - name: Clone Submodule
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: git submodule update --init --recursive --progress

    - name: Build braft
      run: bash scripts/ci_build_braft.sh "$DINGO_EUREKA_INSTALL_PATH"

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DLINK_TCMALLOC=ON -DBUILD_UNIT_TESTS=ON

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Snapshot reader regression
      run: |
        ./build/bin/dingodb_unit_test --gtest_filter=DingoSnapshotReaderTest.* --gtest_output=xml:build/snapshot-reader-results.xml
        python3 - <<'PY'
        import xml.etree.ElementTree as ET
        root = ET.parse("build/snapshot-reader-results.xml").getroot()
        executed = [case for case in root.iter("testcase")
                    if case.get("status") == "run" and case.find("skipped") is None]
        if not executed:
            raise SystemExit("Snapshot reader regression ran no tests")
        print(f"Snapshot reader regression executed {len(executed)} tests")
        PY
